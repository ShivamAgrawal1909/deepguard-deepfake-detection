{% extends "base.html" %}
{% block title %}Contact Us - DeepGuard{% endblock %}
{% block content %}
<div style="max-width:600px;margin:3rem auto;padding:0 2rem;">
    <h1 style="color:var(--primary);margin-bottom:1rem;">Contact Us</h1>
    <div class="card"><div class="card-body">
        <form method="POST">
            <div class="form-group"><label class="form-label">Name</label><input name="name" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Subject</label><input name="subject" class="form-control" required></div>
            <div class="form-group"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="5" required></textarea></div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div></div>
</div>
{% endblock %}

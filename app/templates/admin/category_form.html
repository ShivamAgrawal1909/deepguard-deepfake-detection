{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if category else 'Add' }} Category{% endblock %}
{% block breadcrumb %}{{ 'Edit' if category else 'Add' }} Category{% endblock %}
{% block content %}
<div class="admin-page-header"><h1>{{ 'Edit' if category else 'Add New' }} Video Category</h1></div>
<div class="admin-card settings-card"><div class="admin-card-body">
    <form method="POST">
        <div class="form-group"><label class="form-label">Category Name</label><input name="name" class="form-control" value="{{ category.name if category else '' }}" required placeholder="e.g. Interview, News, Social Media"></div>
        <div class="form-group"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3" placeholder="Brief description of this category">{{ category.description if category else '' }}</textarea></div>
        <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Save Category</button><a href="{{ url_for('admin.categories') }}" class="btn btn-outline">Cancel</a></div>
    </form>
</div></div>
{% endblock %}
